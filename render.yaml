services:
  - type: web
    name: birloto
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        value: mongodb+srv://r77513973_db_user:ZnVE8V5URKL2VG9i@venomkzn.utujwym.mongodb.net/?appName=Venomkzn
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # ── Telegram bot inteqrasiyası ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # Render Dashboard-dan əl ilə daxil edin
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false        # Admin-in şəxsi chat ID-si (bot started olmalıdır)
      # ── Oyun mühəndisi üçün tuning ──
      - key: GAME_WAITING_SEC
        value: 5           # Round-lar arası gözləmə artıq 5 saniyədir (75 deyil)
      - key: GAME_STARTING_WINDOW_SEC
        value: 3           # Yeni round başlayanadək görünən "Başlayır" pəncərəsi
      - key: GAME_DRAW_INTERVAL_SEC
        value: 5           # Daş çəkilişi arasında saniyə
      - key: GAME_ROUND_DURATION_SEC
        value: 360         # Round-un ümumi müddəti (saniyə)
