services:
  - type: web
    name: birloto
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      # MONGODB_URI dəyərini Render Dashboard → Environment bölməsində əl ilə yazın.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # QEYD: PORT dəyərini BURADA təyin etməyin — Render onu özü verir.
      # Əl ilə 3000 yazıldıqda proses Render-in gözlədiyi portu dinləmir və
      # deploy "Cause of failure could not be determined" xətası ilə dayanır.
      # ── Telegram bot inteqrasiyası ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # Render Dashboard-dan əl ilə daxil edin
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false        # Admin-in şəxsi chat ID-si (bot started olmalıdır)
      # ── Admin panel girişi (ENV əsaslı) ──
      - key: ADMIN_USERNAME
        sync: false        # məs: admin
      - key: ADMIN_PASSWORD
        sync: false        # güclü şifrə seçin
      # ── Oyun mühəndisi üçün tuning ──
      - key: GAME_WAITING_SEC
        value: "5"
      - key: GAME_STARTING_WINDOW_SEC
        value: "3"
      - key: GAME_DRAW_INTERVAL_SEC
        value: "5"
      - key: GAME_ROUND_DURATION_SEC
        value: "360"
